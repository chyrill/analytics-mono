name: Deploy — Analytics Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true
        type: string
      release_notes:
        description: 'Release notes (optional)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.6'
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=harvest-infra" \
            -backend-config="key=analytics-mono/production/terraform.tfstate" \
            -backend-config="region=ap-southeast-2"

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.ANALYTICS_DB_PASSWORD }}
          TF_VAR_zoho_client_secret: ${{ secrets.ZOHO_CLIENT_SECRET }}
          TF_VAR_zoho_refresh_token: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          TF_VAR_saleor_api_token: ${{ secrets.SALEOR_API_TOKEN }}
          TF_VAR_docapp_database_url: ${{ secrets.DOCAPP_DATABASE_URL }}
        run: terraform apply -auto-approve -var-file="tfvars/production.tfvars"

      # ── Package Lambda artifacts ─────────────────────────────────────────────

      - name: Package API Lambdas
        run: |
          for HANDLER in customers ingest; do
            mkdir -p "/tmp/analytics-api-${HANDLER}"
            npx esbuild "apps/api/src/handlers/${HANDLER}.ts" \
              --bundle --platform=node --target=node20 \
              --outfile="/tmp/analytics-api-${HANDLER}/${HANDLER}.js" \
              --external:pg-native
            cd "/tmp/analytics-api-${HANDLER}" && zip -r "/tmp/analytics-api-${HANDLER}.zip" . && cd -
          done

      - name: Package Sync Lambdas
        run: |
          for HANDLER in zoho saleor doc-app; do
            mkdir -p "/tmp/analytics-sync-${HANDLER}"
            npx esbuild "apps/sync/src/handlers/${HANDLER}.ts" \
              --bundle --platform=node --target=node20 \
              --outfile="/tmp/analytics-sync-${HANDLER}/${HANDLER}.js" \
              --external:pg-native
            cd "/tmp/analytics-sync-${HANDLER}" && zip -r "/tmp/analytics-sync-${HANDLER}.zip" . && cd -
          done

      - name: Package Migration Lambda
        run: |
          BUNDLE_DIR=/tmp/analytics-migration-bundle
          rm -rf "$BUNDLE_DIR" && mkdir -p "$BUNDLE_DIR"
          npx esbuild packages/db/src/migrate-lambda.ts \
            --bundle --platform=node --target=node20 \
            --outfile="$BUNDLE_DIR/index.js" \
            --external:pg-native
          cp -r packages/db/migrations "$BUNDLE_DIR/migrations"
          cd "$BUNDLE_DIR" && zip -r /tmp/analytics-migration.zip .

      # ── Deploy Lambda function code ──────────────────────────────────────────

      - name: Deploy API Lambda function code
        run: |
          for HANDLER in customers ingest; do
            aws lambda update-function-code \
              --function-name "harvest-analytics-api-${HANDLER}-production" \
              --zip-file "fileb:///tmp/analytics-api-${HANDLER}.zip" \
              --region ap-southeast-2
          done

      - name: Deploy Sync Lambda function code
        run: |
          for HANDLER in zoho saleor doc-app; do
            aws lambda update-function-code \
              --function-name "harvest-analytics-sync-${HANDLER}-production" \
              --zip-file "fileb:///tmp/analytics-sync-${HANDLER}.zip" \
              --region ap-southeast-2
          done

      - name: Deploy Migration Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name "harvest-analytics-migration-production" \
            --zip-file "fileb:///tmp/analytics-migration.zip" \
            --region ap-southeast-2

      - name: Wait for Migration Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name "harvest-analytics-migration-production" \
            --region ap-southeast-2

      # ── Run database migrations ──────────────────────────────────────────────

      - name: Run database migrations
        run: |
          INVOKE_RESULT=$(aws lambda invoke \
            --function-name "harvest-analytics-migration-production" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --region ap-southeast-2 \
            /tmp/migration-result.json)

          echo "Invoke metadata: $INVOKE_RESULT"
          echo "Migration response:"
          cat /tmp/migration-result.json

          if echo "$INVOKE_RESULT" | grep -q '"FunctionError"'; then
            echo "ERROR: Database migration Lambda failed — aborting deploy"
            exit 1
          fi

      # ── Deploy web ───────────────────────────────────────────────────────────

      - name: Sync web to S3
        run: |
          WEB_BUCKET=$(cd infra && terraform output -raw web_bucket)
          aws s3 sync apps/web/out/ "s3://${WEB_BUCKET}/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync apps/web/out/ "s3://${WEB_BUCKET}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          CF_ID=$(cd infra && terraform output -raw web_cloudfront_id)
          aws cloudfront create-invalidation \
            --distribution-id "${CF_ID}" \
            --paths "/*"
